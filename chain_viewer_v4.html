
<style>
* { box-sizing: border-box; }
#app { padding: 12px; font-family: var(--font-sans); }
#controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
#controls label { font-size: 13px; color: var(--text-secondary); }
#info-bar { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; min-height: 18px; }
#canvas-wrap { overflow: hidden; border: 0.5px solid var(--border); border-radius: var(--radius); background: var(--surface-1); }
canvas { display: block; cursor: grab; }
canvas.grabbing { cursor: grabbing; }
#tooltip { position: fixed; display: none; background: var(--surface-2); border: 0.5px solid var(--border-strong); border-radius: var(--radius); padding: 8px 10px; font-size: 12px; color: var(--text-primary); pointer-events: none; max-width: 280px; z-index: 999; line-height: 1.6; }
#legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; }
.leg { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-secondary); }
.leg-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
#hint { font-size: 11px; color: var(--text-muted, #999); margin-top: 4px; }
</style>

<div id="app">
  <div id="controls">
    <label>Load JSON: <input type="file" id="file-in" accept=".json"></label>
    <button onclick="resetView()">Reset view</button>
    <button onclick="clearSelection()">Clear selection</button>
    <button onclick="exportPNG()">Export PNG</button>
    <button onclick="loadSample()">Load sample ↗</button>
  </div>
  <div id="info-bar">Load a mark_avoidable JSON file, or click "Load sample".</div>
  <div id="canvas-wrap"><canvas id="c" width="900" height="500"></canvas></div>
  <div id="legend">
    <div class="leg"><div class="leg-dot" style="background:#888780"></div>Origin</div>
    <div class="leg"><div class="leg-dot" style="background:#1D9E75"></div>Cleared (1 round)</div>
    <div class="leg"><div class="leg-dot" style="background:#378ADD"></div>Cleared (multi-round)</div>
    <div class="leg"><div class="leg-dot" style="background:#E24B4A"></div>Failed</div>
    <div class="leg"><div class="leg-dot" style="background:#F5A623"></div>Loop (mod3 identical)</div>
    <div class="leg"><div class="leg-dot" style="background:#888780; opacity:0.35"></div>Collapsed</div>
  </div>
  <div id="hint">Click to select subtree • Double-click to collapse/expand • Drag to pan • Scroll to zoom</div>
</div>
<div id="tooltip"></div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');
const infoBar = document.getElementById('info-bar');

const NODE_W = 170, NODE_H = 32, COL_W = 210, ROW_H = 44;
let nodes = [], edges = [];
let pan = {x:40,y:40}, scale = 1;
let dragging = false, lastMouse = null, hoveredNode = null;
let selectedId = null;
let collapsed = new Set();

function nodeColor(n) {
  if (n.isOrigin) return '#888780';
  if (n.outcome?.includes('loop')) return '#F5A623';
  if (!n.cleared) return '#E24B4A';
  if (n.hasDeepChildren) return '#378ADD';
  return '#1D9E75';
}

function getDescendants(id, result = new Set()) {
  result.add(id);
  for (const e of edges) if (e.from === id && !result.has(e.to)) getDescendants(e.to, result);
  return result;
}
function getAncestors(id, result = new Set()) {
  result.add(id);
  for (const e of edges) if (e.to === id && !result.has(e.from)) getAncestors(e.from, result);
  return result;
}
function getHighlighted() {
  if (!selectedId) return null;
  return new Set([...getDescendants(selectedId), ...getAncestors(selectedId)]);
}
function getHidden() {
  const hidden = new Set();
  for (const cid of collapsed)
    for (const e of edges) if (e.from === cid) getDescendants(e.to).forEach(id => hidden.add(id));
  return hidden;
}

function buildGraph(data) {
  nodes = []; edges = []; collapsed.clear(); selectedId = null;
  const byCol = {};

  function addNode(rc, round, outcome, cleared, hasDeepChildren, isOrigin) {
    const id = rc + '§' + round;
    if (nodes.find(n => n.id === id)) return id;
    const n = { id, rc, round, outcome: outcome||'', cleared: cleared !== false, hasDeepChildren: !!hasDeepChildren, isOrigin: !!isOrigin, x:0, y:0 };
    nodes.push(n);
    (byCol[round] = byCol[round]||[]).push(n);
    return id;
  }
  function addEdge(from, to) {
    if (from && to && from !== to && !edges.find(e => e.from===from && e.to===to))
      edges.push({from, to});
  }
  function walk(histArr, parentId) {
    if (!histArr?.length) return;
    for (const entry of histArr) {
      if (!entry?.node) continue;
      const isLoop = entry.outcome?.includes('loop');
      const hasDeep = !isLoop && !!(entry.children?.some(c => c.history?.some(h => h.children?.length)));
      const id = addNode(entry.node, entry.round, entry.outcome, !isLoop && entry.outcome !== 'failed' && !entry.outcome?.includes('limit'), hasDeep, false);
      addEdge(parentId, id);
      if (entry.children && !isLoop) {
        for (const child of entry.children) {
          if (child?.history) walk(child.history, id);
        }
      }
    }
  }

  const originId = addNode(data.start_rc, 0, data.proven_avoidable ? 'avoidable' : 'failed', data.proven_avoidable, false, true);
  if (data.history) {
    walk(data.history, originId);
    for (const h of data.history) {
      if (h?.node && h?.round) addEdge(originId, h.node + '§' + h.round);
    }
  }

  // Layout
  const cols = Object.keys(byCol).map(Number).sort((a,b)=>a-b);
  for (const col of cols) byCol[col].forEach((n,i) => { n.x = col*COL_W; n.y = i*ROW_H; });

  resizeCanvas();
  const maxRound = nodes.length ? Math.max(...nodes.map(n=>n.round)) : 0;
  infoBar.textContent = `${data.start_rc}  •  avoidable: ${data.proven_avoidable}  •  ${nodes.length} nodes  •  ${maxRound} rounds`;
  draw();
}

function resizeCanvas() {
  if (!nodes.length) return;
  const hidden = getHidden();
  const vis = nodes.filter(n => !hidden.has(n.id));
  if (!vis.length) return;
  canvas.width = Math.max(900, Math.max(...vis.map(n=>n.x)) + NODE_W + 80);
  canvas.height = Math.max(400, Math.max(...vis.map(n=>n.y)) + NODE_H + 60);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.translate(pan.x, pan.y);
  ctx.scale(scale, scale);

  const hidden = getHidden();
  const hl = getHighlighted();

  for (const e of edges) {
    if (hidden.has(e.from) || hidden.has(e.to)) continue;
    const from = nodes.find(n=>n.id===e.from), to = nodes.find(n=>n.id===e.to);
    if (!from||!to) continue;
    const dimmed = hl && (!hl.has(e.from)||!hl.has(e.to));
    const x1=from.x+NODE_W, y1=from.y+NODE_H/2, x2=to.x, y2=to.y+NODE_H/2, mx=(x1+x2)/2;
    ctx.beginPath();
    ctx.strokeStyle = dimmed ? '#88878018' : nodeColor(to)+'55';
    ctx.lineWidth = dimmed ? 0.3 : 0.9;
    ctx.moveTo(x1,y1); ctx.bezierCurveTo(mx,y1,mx,y2,x2,y2); ctx.stroke();
  }

  for (const n of nodes) {
    if (hidden.has(n.id)) continue;
    const color = nodeColor(n);
    const isHover = hoveredNode===n, isSel = selectedId===n.id;
    const dimmed = hl && !hl.has(n.id);
    const isCollapsed = collapsed.has(n.id);
    const hasChildren = edges.some(e=>e.from===n.id);

    ctx.beginPath(); roundRect(ctx,n.x,n.y,NODE_W,NODE_H,5);
    ctx.fillStyle = color+(dimmed?'0d':(isSel?'35':'18')); ctx.fill();
    ctx.strokeStyle = isSel ? color : (dimmed ? color+'18' : color+(isHover?'cc':'66'));
    ctx.lineWidth = isSel ? 2 : (isHover?1.2:0.7); ctx.stroke();

    if (hasChildren) {
      const cx=n.x+NODE_W-10, cy=n.y+NODE_H/2;
      ctx.beginPath(); ctx.arc(cx,cy,5,0,Math.PI*2);
      ctx.fillStyle = isCollapsed ? color+'cc' : color+'44'; ctx.fill();
      ctx.fillStyle='#fff'; ctx.font='bold 8px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(isCollapsed?'+':'−', cx, cy);
    }

    ctx.fillStyle = dimmed ? color+'33' : color;
    ctx.font = `${isSel||isHover?500:400} 11px var(--font-sans,sans-serif)`;
    ctx.textBaseline='top'; ctx.textAlign='left';
    const maxLen = hasChildren ? 21 : 24;
    ctx.fillText(n.rc.length>maxLen ? n.rc.slice(0,maxLen-1)+'…' : n.rc, n.x+7, n.y+5);
    ctx.fillStyle = dimmed ? color+'22' : color+'aa';
    ctx.font='9.5px var(--font-sans,sans-serif)';
    const sub = n.isOrigin ? 'origin' : (n.outcome?.includes('loop') ? 'loop' : `r${n.round}`);
    ctx.fillText(sub, n.x+7, n.y+18);
  }
  ctx.restore();
}

function roundRect(ctx,x,y,w,h,r) {
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

function getNodeAt(mx,my) {
  const wx=(mx-pan.x)/scale, wy=(my-pan.y)/scale;
  const hidden = getHidden();
  for (let i=nodes.length-1;i>=0;i--) {
    const n=nodes[i];
    if (hidden.has(n.id)) continue;
    if (wx>=n.x&&wx<=n.x+NODE_W&&wy>=n.y&&wy<=n.y+NODE_H) return n;
  }
  return null;
}

let lastClick=0, lastClickId=null;
canvas.addEventListener('click', e => {
  const r=canvas.getBoundingClientRect();
  const n=getNodeAt(e.clientX-r.left, e.clientY-r.top);
  const now=Date.now();
  if (n && now-lastClick<350 && lastClickId===n.id) {
    if (collapsed.has(n.id)) collapsed.delete(n.id); else collapsed.add(n.id);
    resizeCanvas(); draw();
  } else {
    selectedId = (selectedId===n?.id) ? null : (n?.id||null); draw();
  }
  lastClick=now; lastClickId=n?.id||null;
});

canvas.addEventListener('mousemove', e => {
  const r=canvas.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  if (dragging&&lastMouse) {
    pan.x+=e.clientX-lastMouse.x; pan.y+=e.clientY-lastMouse.y;
    lastMouse={x:e.clientX,y:e.clientY}; draw(); return;
  }
  const n=getNodeAt(mx,my);
  if (n!==hoveredNode) { hoveredNode=n; draw(); }
  if (n) {
    tooltip.style.display='block';
    tooltip.style.left=(e.clientX+14)+'px'; tooltip.style.top=(e.clientY-8)+'px';
    const childCount=edges.filter(e2=>e2.from===n.id).length;
    tooltip.innerHTML=`<strong>${n.rc}</strong><br>Round: ${n.round}<br>Outcome: ${n.outcome||'—'}<br>Children: ${childCount}${collapsed.has(n.id)?' (collapsed)':''}`;
  } else { tooltip.style.display='none'; }
});

canvas.addEventListener('mousedown', e => { dragging=true; lastMouse={x:e.clientX,y:e.clientY}; canvas.classList.add('grabbing'); });
window.addEventListener('mouseup', () => { dragging=false; canvas.classList.remove('grabbing'); lastMouse=null; });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const r=canvas.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  const f=e.deltaY>0?0.88:1.14;
  const ns=Math.max(0.1,Math.min(5,scale*f));
  pan.x=mx-(mx-pan.x)*(ns/scale); pan.y=my-(my-pan.y)*(ns/scale);
  scale=ns; draw();
},{passive:false});

function resetView() { pan={x:40,y:40}; scale=1; draw(); }
function clearSelection() { selectedId=null; draw(); }

function exportPNG() {
  const hidden=getHidden();
  const vis=nodes.filter(n=>!hidden.has(n.id));
  if (!vis.length) return;
  const pad=40;
  const minX=Math.min(...vis.map(n=>n.x))-pad, minY=Math.min(...vis.map(n=>n.y))-pad;
  const W=Math.max(...vis.map(n=>n.x+NODE_W))+pad-minX;
  const H=Math.max(...vis.map(n=>n.y+NODE_H))+pad-minY;
  const oc=document.createElement('canvas'); oc.width=W; oc.height=H;
  const c2=oc.getContext('2d');
  c2.fillStyle='#ffffff'; c2.fillRect(0,0,W,H);
  c2.translate(-minX,-minY);
  for (const e of edges) {
    if (hidden.has(e.from)||hidden.has(e.to)) continue;
    const from=nodes.find(n=>n.id===e.from), to=nodes.find(n=>n.id===e.to);
    if (!from||!to) continue;
    const x1=from.x+NODE_W,y1=from.y+NODE_H/2,x2=to.x,y2=to.y+NODE_H/2,mx=(x1+x2)/2;
    c2.beginPath(); c2.strokeStyle=nodeColor(to)+'55'; c2.lineWidth=0.9;
    c2.moveTo(x1,y1); c2.bezierCurveTo(mx,y1,mx,y2,x2,y2); c2.stroke();
  }
  for (const n of vis) {
    const color=nodeColor(n);
    c2.beginPath(); roundRect(c2,n.x,n.y,NODE_W,NODE_H,5);
    c2.fillStyle=color+'1a'; c2.fill();
    c2.strokeStyle=color+'88'; c2.lineWidth=0.8; c2.stroke();
    c2.fillStyle=color; c2.font='400 11px Arial,sans-serif';
    c2.textBaseline='top'; c2.textAlign='left';
    const label=n.rc.length>24?n.rc.slice(0,22)+'…':n.rc;
    c2.fillText(label,n.x+7,n.y+5);
    c2.fillStyle=color+'aa'; c2.font='9.5px Arial,sans-serif';
    const sub=n.isOrigin?'origin':(n.outcome?.includes('loop')?'loop':`r${n.round}`);
    c2.fillText(sub,n.x+7,n.y+18);
  }
  const a=document.createElement('a'); a.download='chain_tree.png'; a.href=oc.toDataURL('image/png'); a.click();
}

function loadSample() {
  buildGraph({
    n:50, start_rc:'-10,+3,+3|1', start_layer:20, proven_avoidable:true, max_rounds:10,
    history:[{ node:'-10,+3,+3|1', round:1, outcome:'cleared',
      children:[
        {child:'+21|0',cleared:true,history:[{node:'+21|0',round:2,outcome:'cleared - all grandparents escape'}]},
        {child:'-14,+3|3',cleared:true,history:[{node:'-14,+3|3',round:2,outcome:'cleared',
          children:[
            {child:'-14,+5|4',cleared:true,history:[{node:'-14,+5|4',round:3,outcome:'cleared',
              children:[
                {child:'-14,+5|1',cleared:false,history:[{node:'-14,+5|1',round:4,outcome:'loop - mod3 identical to origin'}]},
                {child:'-14,+7|5',cleared:true,history:[{node:'-14,+7|5',round:4,outcome:'cleared - all grandparents escape'}]},
                {child:'-20|6',cleared:true,history:[{node:'-20|6',round:4,outcome:'cleared - all grandparents escape'}]}
              ]
            }]}
          ]
        }]},
        {child:'-18|2',cleared:false,history:[{node:'-18|2',round:2,outcome:'failed - limit reached'}]}
      ]
    }]
  });
}

draw();
</script>
